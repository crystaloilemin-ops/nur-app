<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нур — Путь поминания Аллаха</title>
<meta name="theme-color" content="#174b38">
<link rel="manifest" href="./manifest.json">


<style>
:root {
  --green: #174b38;
  --green-dark: #103729;
  --green-light: #e6eddf;
  --gold: #d8b76c;
  --gold-light: #f1dfaa;
  --cream: #f7f5ed;
  --white: #fffefa;
  --text: #263b30;
  --muted: #718075;
  --border: #e5e7db;
  --shadow: 0 12px 32px rgba(23, 75, 56, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(ellipse at top, #e8eee1 0%, transparent 55%),
    var(--cream);
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.6;
}

button {
  font: inherit;
  border: none;
  border-radius: 14px;
  padding: 13px 18px;
  margin: 5px;
  background: var(--green);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease,
    background 0.2s ease;
}

button:hover {
  background: var(--green-dark);
  box-shadow: 0 6px 16px rgba(16, 55, 41, 0.15);
  transform: translateY(-2px);
}

button:active {
  transform: scale(0.98);
}

button:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

.app {
  width: 100%;
  max-width: 1050px;
  margin: 0 auto;
  padding: 24px;
}

header {
  position: relative;
  overflow: hidden;
  text-align: center;
  padding: 38px 20px;
  background: linear-gradient(135deg, #103729, #205b43);
  color: white;
  border: 1px solid rgba(216, 183, 108, 0.45);
  border-radius: 28px;
  box-shadow: 0 18px 40px rgba(16, 55, 41, 0.17);
}

header::before,
header::after {
  content: "✧";
  position: absolute;
  color: var(--gold);
  font-size: 50px;
  opacity: 0.55;
}

header::before {
  top: 10px;
  left: 24px;
}

header::after {
  right: 24px;
  bottom: 8px;
}

.logo {
  font-size: 46px;
  color: var(--gold-light);
  line-height: 1.4;
}

header h1 {
  margin: 6px 0;
  font-size: clamp(30px, 5vw, 42px);
  letter-spacing: 1px;
}

header p {
  margin: 4px 0 0;
  color: #e6eadf;
}

.welcome {
  margin: 24px 0;
  padding: 24px;
  background: linear-gradient(120deg, #e7eddf, #f4f0df);
  border: 1px solid #e0e4d5;
  border-radius: 22px;
  box-shadow: var(--shadow);
}

.welcome p:first-child {
  margin-top: 0;
  font-size: 29px;
  color: var(--green);
  text-align: right;
}

.welcome h2 {
  margin-bottom: 5px;
  color: var(--green);
}

.welcome p:last-child {
  margin-bottom: 0;
}

h2 {
  font-size: 22px;
  color: var(--green);
}

main > h2 {
  margin: 28px 0 14px;
}

.counter {
  padding: 28px 20px;
  text-align: center;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: var(--shadow);
}

.counter p {
  color: var(--muted);
}

#count {
  margin: 10px;
  font-size: clamp(48px, 8vw, 64px);
  font-weight: 700;
  line-height: 1.3;
  color: var(--green);
  font-variant-numeric: tabular-nums;
}

#countButton {
  min-width: 170px;
  background: linear-gradient(135deg, #205b43, #123d2d);
  color: white;
}

.secondary {
  background: var(--green-light);
  color: var(--green);
}

.secondary:hover {
  background: #d6e3d0;
  color: var(--green-dark);
}

.menu {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.menu-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 0;
  min-height: 160px;
  margin: 0;
  padding: 22px 12px;
  background: var(--white);
  color: var(--green);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 5px 18px rgba(23, 75, 56, 0.04);
}

.menu-card:hover {
  background: #fffdf6;
  border-color: var(--gold);
}

.menu-card span {
  font-size: 31px;
  line-height: 1.5;
  color: #b18b42;
}

.menu-card strong {
  font-size: 17px;
}

.menu-card small {
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
}

.content {
  display: block;
  width: 100%;
  min-width: 0;
  margin-top: 24px;
  padding: 24px;
  min-height: 100px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: var(--shadow);
  overflow-wrap: anywhere;
}

.content > h2:first-child {
  margin-top: 0;
}

.dhikr-card {
  padding: 22px;
  margin: 16px 0;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: #fbfcf8;
}

.arabic {
  font-size: clamp(23px, 4vw, 29px);
  line-height: 2;
  text-align: right;
  color: var(--green);
}

.dhikr-card small {
  display: block;
  margin-top: 12px;
  line-height: 1.7;
  color: var(--muted);
}

.category-button {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 17px 20px;
  text-align: right;
  background: #edf1e7;
  color: var(--green);
  border: 1px solid #dce5d9;
  border-radius: 15px;
  font-size: 17px;
}

.category-button:hover {
  background: #dfe9d8;
}

footer {
  margin: 30px 0 12px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}

@media (max-width: 650px) {
  .app {
    padding: 14px;
  }

  header {
    padding: 30px 14px;
    border-radius: 22px;
  }

  header::before {
    left: 12px;
  }

  header::after {
    right: 12px;
  }

  .welcome,
  .content {
    padding: 18px;
  }

  .menu {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .menu-card {
    min-height: 105px;
  }

  .counter {
    padding: 22px 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>


  
</head>
<body>
  
<div class="app">
  <header>
    <div class="logo">نُور</div>
    <h1>Нур</h1>
    <p>Путь поминания Аллаха</p>
  </header>

  <main>
    <section class="welcome">
      <p>السلام عليكم</p>
      <h2>Ассаляму алейкум!</h2>
      <p>Пусть день будет наполнен благом.</p>
    </section>

    <h2>Мой зикр</h2>

    <section class="counter">
      <p>Количество повторений</p>
      <div id="count">0</div>
      <button id="countButton">СубханАллах</button>
      <button id="resetButton" class="secondary">
        Сбросить счётчик
      </button>
    </section>

    <h2>Разделы</h2>

    <section class="menu">
      <button class="menu-card" data-section="azkar">
        <span>أذكار</span>
        <strong>Азкары</strong>
        <small>Поминание Аллаха</small>
      </button>

      <button class="menu-card" data-section="dua">
        <span>دعاء</span>
        <strong>Дуа</strong>
        <small>Мольбы</small>
      </button>


<button class="menu-card" data-section="qibla">
  <span>🧭</span>
  <strong>Компас киблы</strong>
  <small>Направление на Каабу</small>
</button>

</section>

<section id="content" class="content">
      Выбери раздел, чтобы продолжить.
    </section>
  </main>

  <footer>
    Создано с намерением приносить пользу
  </footer>
</div>


  <script>
    
let count = 0;

const countDisplay = document.getElementById("count");
const countButton = document.getElementById("countButton");
const resetButton = document.getElementById("resetButton");
const content = document.getElementById("content");

// Счётчик зикра
countButton.addEventListener("click", function () {
  count++;
  countDisplay.textContent = count;
});

resetButton.addEventListener("click", function () {
  count = 0;
  countDisplay.textContent = count;
});

// Данные приложения
const sections = {
  azkar: {
    title: "Азкары",
    categories: {
      morning: {
        title: "Утренние азкары",
        items: [
          {
            arabic: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",
            translation: "С именем Аллаха, с именем Которого ничто не причинит вреда ни на земле, ни на небесах. Он — Всеслышащий, Всезнающий.",
            count: 3,
            source: "Сунан Абу Дауд, 5088; Хисн аль-Муслим, 86."
          },
          {
            arabic: "رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ نَبِيًّا",
            translation: "Я доволен Аллахом как Господом, исламом как религией и Мухаммадом ﷺ как пророком.",
            count: 3,
            source: "Хисн аль-Муслим, 87."
          }
        ]
      },

      evening: {
        title: "Вечерние азкары",
        items: [
          {
            arabic: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",
            translation: "С именем Аллаха, с именем Которого ничто не причинит вреда ни на земле, ни на небесах. Он — Всеслышащий, Всезнающий.",
            count: 3,
            source: "Сунан Абу Дауд, 5088; Хисн аль-Муслим, 86."
          },
          {
            arabic: "رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ نَبِيًّا",
            translation: "Я доволен Аллахом как Господом, исламом как религией и Мухаммадом ﷺ как пророком.",
            count: 3,
            source: "Хисн аль-Муслим, 87."
          }
        ]
      }
    }
  },

  dua: {
    title: "Дуа",
    items: [
      {
        arabic: "رَبِّ زِدْنِي عِلْمًا",
        translation: "Господи, прибавь мне знания!",
        count: 1,
        source: "Коран, сура «Та Ха», 20:114."
      },
      {
        arabic: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
        translation: "Господь наш! Даруй нам добро в этом мире и добро в Последней жизни и защити нас от наказания Огня.",
        count: 1,
        source: "Коран, сура «Аль-Бакара», 2:201."
      },
      {
        arabic: "رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ",
        translation: "Господь наш! Мы поступили несправедливо по отношению к себе. Если Ты не простишь нас и не помилуешь нас, мы окажемся среди потерпевших убыток.",
        count: 1,
        source: "Коран, сура «Аль-Араф», 7:23."
      }
    ]
  },

    favorite: {
    title: "Скоро появится",
    items: []
  },

  qibla: {
    title: "Компас киблы",
    items: []
  }
};

// Показываем карточки
function showItems(title, items, showBackButton) {
  content.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = title;
  content.appendChild(heading);

  if (showBackButton) {
    const backButton = document.createElement("button");
    backButton.className = "category-button";
    backButton.textContent = "← Назад к азкарам";

    backButton.addEventListener("click", function () {
      showAzkarCategories();
    });

    content.appendChild(backButton);
  }

  items.forEach(function (item) {
    const card = document.createElement("article");
    card.className = "dhikr-card";

    const arabic = document.createElement("p");
    arabic.className = "arabic";
    arabic.lang = "ar";
    arabic.dir = "rtl";
    arabic.textContent = item.arabic;

    const translation = document.createElement("p");
    translation.textContent = item.translation;

    const repetitions = document.createElement("p");
    repetitions.textContent =
      "Количество повторений: " + item.count;

    const source = document.createElement("small");
    source.textContent = "Источник: " + item.source;

    card.append(arabic, translation, repetitions, source);
    content.appendChild(card);
  });
}

// Показываем утренние и вечерние азкары
function showAzkarCategories() {
  const section = sections.azkar;

  content.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = section.title;
  content.appendChild(heading);

  Object.keys(section.categories).forEach(function (key) {
    const category = section.categories[key];

    const categoryButton = document.createElement("button");
    categoryButton.className = "category-button";
    categoryButton.textContent = category.title;

    categoryButton.addEventListener("click", function () {
      showItems(category.title, category.items, true);
    });

    content.appendChild(categoryButton);
  });
}


function showQibla() {
  content.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = "Компас киблы";
  content.appendChild(heading);

  const info = document.createElement("p");
  info.textContent =
    "Разреши доступ к местоположению, чтобы рассчитать направление на Каабу.";
  content.appendChild(info);

  const direction = document.createElement("p");
  direction.textContent = "Направление: рассчитывается после определения местоположения";
  content.appendChild(direction);

  const compass = document.createElement("div");
  compass.textContent = "🧭";
  compass.style.fontSize = "90px";
  compass.style.textAlign = "center";
  compass.style.margin = "20px";
  content.appendChild(compass);

  const arrow = document.createElement("div");
  arrow.textContent = "⬆️";
  arrow.style.fontSize = "55px";
  arrow.style.textAlign = "center";
  arrow.style.transformOrigin = "center";
  content.appendChild(arrow);

  const status = document.createElement("p");
  status.textContent = "Ожидание разрешения на местоположение...";
  content.appendChild(status);

  const button = document.createElement("button");
  button.className = "category-button";
  button.textContent = "Определить направление";
  content.appendChild(button);

  let bearing = null;
  let headingValue = null;

  function updateArrow() {
    if (bearing === null) return;

    direction.textContent =
      "Направление на Каабу: " + Math.round(bearing) + "° от севера";

    if (headingValue !== null) {
      arrow.style.transform =
        "rotate(" + (bearing - headingValue) + "deg)";
      status.textContent = "Компас активен.";
    } else {
      arrow.style.transform = "rotate(" + bearing + "deg)";
      status.textContent =
        "Угол рассчитан от севера. Датчик компаса пока недоступен.";
    }
  }

  function onOrientation(event) {
    if (typeof event.webkitCompassHeading === "number") {
      headingValue = event.webkitCompassHeading;
    } else if (event.absolute && event.alpha !== null) {
      headingValue = (360 - event.alpha) % 360;
    } else {
      return;
    }

    updateArrow();
  }

  button.addEventListener("click", function () {
    if (!navigator.geolocation) {
      status.textContent =
        "Этот браузер не поддерживает определение местоположения.";
      return;
    }

    status.textContent = "Запрашиваем местоположение...";

    navigator.geolocation.getCurrentPosition(
      function (position) {
        const lat = position.coords.latitude * Math.PI / 180;
        const lon = position.coords.longitude * Math.PI / 180;

        const kaabaLat = 21.4225 * Math.PI / 180;
        const kaabaLon = 39.8262 * Math.PI / 180;

        const deltaLon = kaabaLon - lon;

        const y = Math.sin(deltaLon) * Math.cos(kaabaLat);
        const x =
          Math.cos(lat) * Math.sin(kaabaLat) -
          Math.sin(lat) * Math.cos(kaabaLat) * Math.cos(deltaLon);

        bearing =
          (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

        updateArrow();

        if (headingValue === null) {
          status.textContent =
            "Направление рассчитано. Проверяем доступность компаса...";
        }

        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          DeviceOrientationEvent.requestPermission()
            .then(function (permission) {
              if (permission === "granted") {
                window.addEventListener(
                  "deviceorientation",
                  onOrientation
                );
              } else {
                status.textContent =
                  "Направление рассчитано, но доступ к компасу не разрешён.";
              }
            })
            .catch(function () {
              status.textContent =
                "Не удалось включить компас. Угол направления рассчитан.";
            });
        } else {
          window.addEventListener(
            "deviceorientationabsolute",
            onOrientation
          );
          window.addEventListener(
            "deviceorientation",
            onOrientation
          );
        }
      },
      function () {
        status.textContent =
          "Не удалось получить местоположение. Разреши доступ в браузере и попробуй снова.";
      },
      {
        enableHighAccuracy: true,
        timeout: 15000
      }
    );
  });
}


// Обработчик главных кнопок — только один
document.querySelectorAll(".menu-card").forEach(function (button) {
  button.addEventListener("click", function () {
    const section = sections[button.dataset.section];

    if (!section) {
      return;
    }

    if (section.categories) {
      showAzkarCategories();
      return;
    }

    if (button.dataset.section === "qibla") {
  showQibla();
  return;
}

    content.replaceChildren();

    const heading = document.createElement("h2");
    heading.textContent = section.title;
    content.appendChild(heading);

    if (!section.items || section.items.length === 0) {
      const message = document.createElement("p");
      message.textContent =
        "Этот раздел появится в будущих обновлениях.";
      content.appendChild(message);
      return;
    }

    showItems(section.title, section.items, false);
  });
});

  </script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>
</body>
</html>
