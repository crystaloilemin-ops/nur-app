<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нур — Путь поминания Аллаха</title>
  <meta name="theme-color" content="#174b38">
  <link rel="manifest" href="./manifest.json">

<style>
:root {
  --green: #174b38;
  --green-dark: #103729;
  --green-light: #e6eddf;
  --gold: #d8b76c;
  --gold-light: #f1dfaa;
  --cream: #f7f5ed;
  --white: #fffefa;
  --text: #263b30;
  --muted: #718075;
  --border: #e5e7db;
  --shadow: 0 12px 32px rgba(23, 75, 56, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(ellipse at 15% 5%, rgba(216, 183, 108, 0.13), transparent 35%),
    radial-gradient(ellipse at 90% 30%, rgba(23, 75, 56, 0.08), transparent 35%),
    var(--cream);
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.6;
}

button {
  font: inherit;
  border: none;
  border-radius: 14px;
  padding: 13px 18px;
  margin: 5px;
  background: var(--green);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease,
    background 0.2s ease;
}

button:hover {
  background: var(--green-dark);
  box-shadow: 0 6px 16px rgba(16, 55, 41, 0.15);
  transform: translateY(-2px);
}

button:active {
  transform: scale(0.98);
}

button:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 4px;
}

.app {
  width: 100%;
  max-width: 1050px;
  margin: 0 auto;
  padding: 24px;
}

header {
  position: relative;
  overflow: hidden;
  text-align: center;
  padding: 38px 20px;
  background:
    radial-gradient(circle at 50% 0%, rgba(216, 183, 108, 0.18), transparent 55%),
    linear-gradient(135deg, #103729, #205b43 65%, #174b38);
  color: white;
  border: 1px solid rgba(216, 183, 108, 0.45);
  border-radius: 28px;
  box-shadow: 0 18px 40px rgba(16, 55, 41, 0.17);
  animation: nurFadeIn 0.8s ease both;
}

header::before,
header::after {
  content: "✧";
  position: absolute;
  color: var(--gold);
  font-size: 50px;
  opacity: 0.55;
}

header::before {
  top: 10px;
  left: 24px;
}

header::after {
  right: 24px;
  bottom: 8px;
}

.logo {
  font-size: 46px;
  color: var(--gold-light);
  line-height: 1.4;
  text-shadow: 0 0 28px rgba(241, 223, 170, 0.3);
  animation: nurTwinkle 5s ease-in-out infinite;
}

header h1 {
  margin: 6px 0;
  font-size: clamp(30px, 5vw, 42px);
  letter-spacing: 1px;
}

header p {
  margin: 4px 0 0;
  color: #e6eadf;
}

.welcome {
  margin: 24px 0;
  padding: 24px;
  background: linear-gradient(120deg, #e7eddf, #f4f0df);
  border: 1px solid #e0e4d5;
  border-radius: 22px;
  box-shadow: var(--shadow);
  animation: nurFadeIn 0.7s ease 0.1s both;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.welcome:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(23, 75, 56, 0.12);
}

.welcome p:first-child {
  margin-top: 0;
  font-size: 29px;
  color: var(--green);
  text-align: right;
}

.welcome h2 {
  margin-bottom: 5px;
  color: var(--green);
}

.welcome p:last-child {
  margin-bottom: 0;
}

h2 {
  font-size: 22px;
  color: var(--green);
}

main > h2 {
  margin: 28px 0 14px;
}

.counter {
  padding: 28px 20px;
  text-align: center;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: var(--shadow);
  animation: nurFadeIn 0.7s ease 0.2s both;
  transition: box-shadow 0.25s ease;
}

.counter p {
  color: var(--muted);
}

#count {
  margin: 10px;
  font-size: clamp(48px, 8vw, 64px);
  font-weight: 700;
  line-height: 1.3;
  color: var(--green);
  font-variant-numeric: tabular-nums;
  transition: transform 0.18s ease, color 0.18s ease;
}

#countButton {
  min-width: 170px;
  background: linear-gradient(135deg, #205b43, #123d2d);
  color: white;
  border: 1px solid rgba(216, 183, 108, 0.45);
  box-shadow: 0 7px 18px rgba(16, 55, 41, 0.15);
}

#countButton:active {
  transform: scale(0.96);
}

.secondary {
  background: var(--green-light);
  color: var(--green);
  border: 1px solid #dce5d9;
}

.secondary:hover {
  background: #d6e3d0;
  color: var(--green-dark);
}

.menu {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.menu-card {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 0;
  min-height: 160px;
  margin: 0;
  padding: 22px 12px;
  background: var(--white);
  color: var(--green);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 5px 18px rgba(23, 75, 56, 0.04);
  animation: nurFadeIn 0.6s ease both;
  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease,
    border-color 0.25s ease,
    background 0.25s ease;
}

.menu-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    135deg,
    rgba(216, 183, 108, 0.13),
    transparent 55%
  );
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}

.menu-card:hover {
  background: #fffdf6;
  border-color: var(--gold);
  transform: translateY(-5px);
  box-shadow: 0 14px 28px rgba(23, 75, 56, 0.12);
}

.menu-card:hover::before {
  opacity: 1;
}

.menu-card span {
  font-size: 31px;
  line-height: 1.5;
  color: #b18b42;
  transition: transform 0.25s ease;
}

.menu-card:hover span {
  transform: scale(1.08);
}

.menu-card strong {
  font-size: 17px;
}

.menu-card small {
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
}

.content {
  display: block;
  width: 100%;
  min-width: 0;
  margin-top: 24px;
  padding: 24px;
  min-height: 100px;
  background: var(--white);
  border: 1px solid rgba(229, 231, 219, 0.9);
  border-radius: 22px;
  box-shadow: var(--shadow);
  overflow-wrap: anywhere;
}

.content > h2:first-child {
  margin-top: 0;
}

.dhikr-card {
  padding: 22px;
  margin: 16px 0;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: #fbfcf8;
  transition:
    transform 0.22s ease,
    box-shadow 0.22s ease,
    border-color 0.22s ease;
}

.dhikr-card:hover {
  transform: translateY(-2px);
  border-color: rgba(216, 183, 108, 0.75);
  box-shadow: 0 9px 22px rgba(23, 75, 56, 0.07);
}

.arabic {
  font-size: clamp(23px, 4vw, 29px);
  line-height: 2;
  text-align: right;
  color: var(--green);
}

.transcription {
  margin-top: 10px;
  font-style: italic;
  color: #8a6d3b;
}

.dhikr-card small {
  display: block;
  margin-top: 12px;
  line-height: 1.7;
  color: var(--muted);
}

.read-button {
  margin: 14px 0 0;
  padding: 10px 16px;
  background: var(--green-light);
  color: var(--green);
  border: 1px solid #dce5d9;
  font-size: 14px;
}

.read-button:hover {
  background: #d6e3d0;
  color: var(--green-dark);
}

.category-button {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 17px 20px;
  text-align: right;
  background: #edf1e7;
  color: var(--green);
  border: 1px solid #dce5d9;
  border-radius: 15px;
  font-size: 17px;
  transition:
    background 0.2s ease,
    transform 0.2s ease,
    border-color 0.2s ease;
}

.category-button:hover {
  background: #dfe9d8;
  transform: translateX(3px);
  border-color: var(--gold);
}

footer {
  margin: 30px 0 12px;
  padding: 12px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  opacity: 0.85;
}

@keyframes nurFadeIn {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes nurTwinkle {
  0%, 100% {
    opacity: 0.4;
    transform: scale(0.9) rotate(0deg);
  }
  50% {
    opacity: 0.9;
    transform: scale(1.1) rotate(12deg);
  }
}

@keyframes cardCascade {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card-cascade {
  animation: cardCascade 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

/* --- Режим чтения --- */
.reading-mode {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #1a2e25;
  color: #f4f3ef;
  padding: 20px;
  overflow-y: auto;
  display: none;
}

.reading-mode.active {
  display: block;
  animation: nurFadeIn 0.3s ease both;
}

.reading-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
}

.reading-header span {
  font-size: 17px;
  font-weight: 600;
}

.reading-close {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: white;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 14px;
}

.reading-close:hover {
  background: rgba(255, 255, 255, 0.1);
}

.reading-content .arabic {
  font-size: clamp(28px, 5vw, 36px);
  line-height: 1.9;
  color: #fffef6;
}

.reading-content .transcription {
  color: rgba(241, 223, 170, 0.85);
}

.reading-content .dhikr-card {
  border: none;
  background: transparent;
  box-shadow: none;
  padding: 0;
  margin: 30px 0;
}

.reading-content small {
  color: rgba(255, 255, 255, 0.6);
}

.bottom-nav {
  position: sticky;
  bottom: 12px;
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 5px;
  max-width: 560px;
  margin: 24px auto 0;
  padding: 9px;
  background: rgba(255, 254, 250, 0.94);
  border: 1px solid rgba(216, 183, 108, 0.55);
  border-radius: 22px;
  box-shadow: 0 10px 32px rgba(16, 55, 41, 0.16);
  backdrop-filter: blur(14px);
}

.bottom-nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  margin: 0;
  padding: 9px 3px;
  background: transparent;
  color: var(--muted);
  border-radius: 14px;
  font-size: 11px;
  transition: background 0.2s ease, color 0.2s ease,
    transform 0.2s ease;
}

.bottom-nav button span {
  font-size: 21px;
  line-height: 1.3;
}

.bottom-nav button:hover,
.bottom-nav button.active {
  background: var(--green-light);
  color: var(--green);
  transform: translateY(-1px);
}

.bottom-nav button.active {
  box-shadow: inset 0 0 0 1px rgba(216, 183, 108, 0.4);
}

@media (max-width: 650px) {
  .app {
    padding: 12px;
  }

  header {
    padding: 30px 14px;
    border-radius: 24px;
  }

  header::before {
    left: 12px;
  }

  header::after {
    right: 12px;
  }

  .welcome,
  .content {
    padding: 18px;
  }

  .menu {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .menu-card {
    min-height: 100px;
    border-radius: 18px;
  }

  .counter {
    padding: 22px 12px;
  }

  .content {
    border-radius: 20px;
  }

  .dhikr-card {
    padding: 18px;
  }
}

@media (max-width: 400px) {
  .bottom-nav {
    bottom: 6px;
    padding: 6px;
  }

  .bottom-nav button {
    font-size: 10px;
  }

  .bottom-nav button span {
    font-size: 19px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

</head>
<body>

<div class="app">
  <header>
    <div class="logo">نُور</div>
    <h1>Нур</h1>
    <p>Путь поминания Аллаха</p>
  </header>

  <main>
    <section class="welcome">
      <p>السلام عليكم</p>
      <h2>Ассаляму алейкум!</h2>
      <p>Пусть день будет наполнен благом.</p>
    </section>

    <h2>Мой зикр</h2>

    <section class="counter">
      <p>Количество повторений</p>
      <div id="count">0</div>
      <button id="countButton">СубханАллах</button>
      <button id="resetButton" class="secondary">
        Сбросить счётчик
      </button>
    </section>

    <h2>Разделы</h2>

    <section class="menu">
      <button class="menu-card" data-section="azkar">
        <span>أذكار</span>
        <strong>Азкары</strong>
        <small>Поминание Аллаха</small>
      </button>

      <button class="menu-card" data-section="dua">
        <span>دعاء</span>
        <strong>Дуа</strong>
        <small>Мольбы</small>
      </button>

      <button class="menu-card" data-section="qibla">
        <span>🧭</span>
        <strong>Компас киблы</strong>
        <small>Направление на Каабу</small>
      </button>

      <button class="menu-card" data-section="prayer">
        <span>🕌</span>
        <strong>Время намаза</strong>
        <small>Расписание для Перми</small>
      </button>
    </section>

    <section id="content" class="content">
      Выбери раздел, чтобы продолжить.
    </section>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button type="button" class="active" data-nav="home">
        <span>⌂</span>
        Главная
      </button>
      <button type="button" data-nav="prayer">
        <span>🕌</span>
        Намаз
      </button>
      <button type="button" data-nav="azkar">
        <span>📿</span>
        Азкары
      </button>
      <button type="button" data-nav="dua">
        <span>🤲</span>
        Дуа
      </button>
    </nav>
  </main>

  <footer>
    Создано с намерением приносить пользу
  </footer>
</div>

<!-- Режим чтения -->
<div class="reading-mode" id="readingMode">
  <div class="reading-header">
    <span>📖 Спокойное чтение</span>
    <button class="reading-close" id="readingClose">Закрыть</button>
  </div>
  <div class="reading-content" id="readingContent"></div>
</div>

<script>
let count = 0;

const countDisplay = document.getElementById("count");
const countButton = document.getElementById("countButton");
const resetButton = document.getElementById("resetButton");
const content = document.getElementById("content");
const readingMode = document.getElementById("readingMode");
const readingContent = document.getElementById("readingContent");
const readingClose = document.getElementById("readingClose");

// Счётчик зикра
countButton.addEventListener("click", function () {
  count++;
  countDisplay.textContent = count;
});

resetButton.addEventListener("click", function () {
  count = 0;
  countDisplay.textContent = count;
});

// Суры и аяты, читаемые утром и вечером

// Режим чтения
function enterReadingMode(item) {
  readingContent.replaceChildren();

  const arabic = document.createElement("p");
  arabic.className = "arabic";
  arabic.lang = "ar";
  arabic.dir = "rtl";
  arabic.textContent = item.arabic;
  readingContent.appendChild(arabic);

  if (item.transcription) {
    const transcription = document.createElement("p");
    transcription.className = "transcription";
    transcription.textContent = item.transcription;
    readingContent.appendChild(transcription);
  }

  if (item.translation) {
    const translation = document.createElement("p");
    translation.textContent = item.translation;
    readingContent.appendChild(translation);
  }

  if (item.source) {
    const source = document.createElement("small");
    source.textContent = "Источник: " + item.source;
    readingContent.appendChild(source);
  }

  readingMode.classList.add("active");
}

readingClose.addEventListener("click", function () {
  readingMode.classList.remove("active");
});

// Анимации
function applyCascadeAnimations() {
  const cards = document.querySelectorAll(".dhikr-card");
  cards.forEach(function (card, index) {
    card.style.animationDelay = (index * 0.08) + "s";
    card.classList.add("card-cascade");
  });
}

// Показываем карточки
function showItems(title, items, backSection) {
  content.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = title;
  content.appendChild(heading);

  if (backSection) {
    const backButton = document.createElement("button");
    backButton.className = "category-button";
    backButton.textContent = "← Назад";

    backButton.addEventListener("click", function () {
      showCategories(backSection);
    });

    content.appendChild(backButton);
  }

  items.forEach(function (item) {
    const card = document.createElement("article");
    card.className = "dhikr-card";

    const arabic = document.createElement("p");
    arabic.className = "arabic";
    arabic.lang = "ar";
    arabic.dir = "rtl";
    arabic.textContent = item.arabic;

    card.append(arabic);

    if (item.transcription) {
      const transcription = document.createElement("p");
      transcription.className = "transcription";
      transcription.textContent = item.transcription;
      card.append(transcription);
    }

    const translation = document.createElement("p");
    translation.textContent = item.translation;
    card.append(translation);

    const repetitions = document.createElement("p");
    repetitions.textContent = "Количество повторений: " + item.count;
    card.append(repetitions);

    if (item.source) {
      const source = document.createElement("small");
      source.textContent = "Источник: " + item.source;
      card.append(source);
    }

    const readButton = document.createElement("button");
    readButton.className = "read-button";
    readButton.type = "button";
    readButton.textContent = "📖 Читать спокойно";
    readButton.addEventListener("click", function () {
      enterReadingMode(item);
    });
    card.appendChild(readButton);

    content.appendChild(card);
  });

  applyCascadeAnimations();
}

// Показываем категории раздела (азкары, дуа и другие)
function showCategories(sectionKey) {
  const section = sections[sectionKey];

  content.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = section.title;
  content.appendChild(heading);

  Object.keys(section.categories).forEach(function (key) {
    const category = section.categories[key];

    const categoryButton = document.createElement("button");
    categoryButton.className = "category-button";
    categoryButton.textContent = category.title;

    categoryButton.addEventListener("click", function () {
      showItems(category.title, category.items, sectionKey);
    });

    content.appendChild(categoryButton);
  });

  applyCascadeAnimations();
}

async function showPrayerTimes() {
  content.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = "🕌 Время намаза";
  content.appendChild(heading);

  const date = document.createElement("p");
  date.textContent = "Город: Пермь";
  content.appendChild(date);

  const status = document.createElement("p");
  status.textContent = "Загружаем расписание...";
  content.appendChild(status);

  const list = document.createElement("div");
  content.appendChild(list);

  const refreshButton = document.createElement("button");
  refreshButton.textContent = "Обновить расписание";
  refreshButton.className = "category-button";
  content.appendChild(refreshButton);

  async function loadTimes() {
    status.textContent = "Загружаем расписание...";
    list.replaceChildren();

    const now = new Date();

    const dateString = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Yekaterinburg",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }).format(now);

    try {
      const url =
        "https://api.aladhan.com/v1/timingsByCity/" +
        dateString.replaceAll("/", "-") +
        "?city=Perm&country=Russia&method=14" +
        "&timezonestring=Asia/Yekaterinburg";

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Ошибка загрузки");
      }

      const result = await response.json();

      if (result.code !== 200 || !result.data?.timings) {
        throw new Error("Расписание недоступно");
      }

      const timings = result.data.timings;

      const prayers = [
        ["Фаджр", timings.Fajr],
        ["Зухр", timings.Dhuhr],
        ["Аср", timings.Asr],
        ["Магриб", timings.Maghrib],
        ["Иша", timings.Isha]
      ];

      status.textContent =
        "Дата: " + result.data.date.readable;

      prayers.forEach(function (prayer) {
        const card = document.createElement("article");
        card.className = "dhikr-card";

        const name = document.createElement("strong");
        name.textContent = prayer[0];

        const time = document.createElement("p");
        time.style.fontSize = "25px";
        time.style.color = "#174b38";
        time.style.marginBottom = "0";
        time.textContent = prayer[1];

        card.append(name, time);
        list.appendChild(card);
      });

      const note = document.createElement("small");
      note.textContent =
        "Время рассчитано автоматически. Оно может отличаться " +
        "от расписания местной мечети.";
      list.appendChild(note);

    } catch (error) {
      status.textContent =
        "Не удалось загрузить расписание. Проверь интернет и нажми «Обновить расписание».";
    }
  }

  refreshButton.addEventListener("click", loadTimes);

  await loadTimes();
  applyCascadeAnimations();
}

function showQibla() {
  content.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = "Компас киблы";
  content.appendChild(heading);

  const info = document.createElement("p");
  info.textContent =
    "Разреши доступ к местоположению, чтобы рассчитать направление на Каабу.";
  content.appendChild(info);

  const direction = document.createElement("p");
  direction.textContent = "Направление: рассчитывается после определения местоположения";
  content.appendChild(direction);

  const compass = document.createElement("div");
  compass.textContent = "🧭";
  compass.style.fontSize = "90px";
  compass.style.textAlign = "center";
  compass.style.margin = "20px";
  content.appendChild(compass);

  const arrow = document.createElement("div");
  arrow.textContent = "⬆️";
  arrow.style.fontSize = "55px";
  arrow.style.textAlign = "center";
  arrow.style.transformOrigin = "center";
  content.appendChild(arrow);

  const status = document.createElement("p");
  status.textContent = "Ожидание разрешения на местоположение...";
  content.appendChild(status);

  const button = document.createElement("button");
  button.className = "category-button";
  button.textContent = "Определить направление";
  content.appendChild(button);

  let bearing = null;
  let headingValue = null;

  function updateArrow() {
    if (bearing === null) return;

    direction.textContent =
      "Направление на Каабу: " + Math.round(bearing) + "° от севера";

    if (headingValue !== null) {
      arrow.style.transform =
        "rotate(" + (bearing - headingValue) + "deg)";
      status.textContent = "Компас активен.";
    } else {
      arrow.style.transform = "rotate(" + bearing + "deg)";
      status.textContent =
        "Угол рассчитан от севера. Датчик компаса пока недоступен.";
    }
  }

  function onOrientation(event) {
    if (typeof event.webkitCompassHeading === "number") {
      headingValue = event.webkitCompassHeading;
    } else if (event.absolute && event.alpha !== null) {
      headingValue = (360 - event.alpha) % 360;
    } else {
      return;
    }

    updateArrow();
  }

  button.addEventListener("click", function () {
    if (!navigator.geolocation) {
      status.textContent =
        "Этот браузер не поддерживает определение местоположения.";
      return;
    }

    status.textContent = "Запрашиваем местоположение...";

    navigator.geolocation.getCurrentPosition(
      function (position) {
        const lat = position.coords.latitude * Math.PI / 180;
        const lon = position.coords.longitude * Math.PI / 180;

        const kaabaLat = 21.4225 * Math.PI / 180;
        const kaabaLon = 39.8262 * Math.PI / 180;

        const deltaLon = kaabaLon - lon;

        const y = Math.sin(deltaLon) * Math.cos(kaabaLat);
        const x =
          Math.cos(lat) * Math.sin(kaabaLat) -
          Math.sin(lat) * Math.cos(kaabaLat) * Math.cos(deltaLon);

        bearing =
          (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

        updateArrow();

        if (headingValue === null) {
          status.textContent =
            "Направление рассчитано. Проверяем доступность компаса...";
        }

        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          DeviceOrientationEvent.requestPermission()
            .then(function (permission) {
              if (permission === "granted") {
                window.addEventListener(
                  "deviceorientation",
                  onOrientation
                );
              } else {
                status.textContent =
                  "Направление рассчитано, но доступ к компасу не разрешён.";
              }
            })
            .catch(function () {
              status.textContent =
                "Не удалось включить компас. Угол направления рассчитан.";
            });
        } else {
          window.addEventListener(
            "deviceorientationabsolute",
            onOrientation
          );
          window.addEventListener(
            "deviceorientation",
            onOrientation
          );
        }
      },
      function () {
        status.textContent =
          "Не удалось получить местоположение. Разреши доступ в браузере и попробуй снова.";
      },
      {
        enableHighAccuracy: true,
        timeout: 15000
      }
    );
  });

  applyCascadeAnimations();
}

// Нижняя навигация
document.querySelectorAll("[data-nav]").forEach(function (button) {
  button.addEventListener("click", function () {
    const sectionName = button.dataset.nav;

    document.querySelectorAll("[data-nav]").forEach(function (item) {
      item.classList.remove("active");
    });

    button.classList.add("active");

    if (sectionName === "home") {
      content.replaceChildren();

      const heading = document.createElement("h2");
      heading.textContent = "Ассаляму алейкум!";
      content.appendChild(heading);

      const message = document.createElement("p");
      message.textContent =
        "Добро пожаловать в Нур. Выбери раздел выше или продолжи зикр.";
      content.appendChild(message);

      document.querySelector(".welcome").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    if (sectionName === "prayer") {
      showPrayerTimes();
    }

    if (sectionName === "azkar") {
      showCategories("azkar");
    }

    if (sectionName === "dua") {
      showCategories("dua");
    }
  });
});

// Обработчик главных кнопок — только один
document.querySelectorAll(".menu-card").forEach(function (button) {
  button.addEventListener("click", function () {
    const section = sections[button.dataset.section];

    if (!section) {
      return;
    }

    if (button.dataset.section === "qibla") {
      showQibla();
      return;
    }

    if (button.dataset.section === "prayer") {
      showPrayerTimes();
      return;
    }

    if (section.categories) {
      showCategories(button.dataset.section);
      return;
    }

    content.replaceChildren();

    const heading = document.createElement("h2");
    heading.textContent = section.title;
    content.appendChild(heading);

    if (!section.items || section.items.length === 0) {
      const message = document.createElement("p");
      message.textContent =
        "Этот раздел появится в будущих обновлениях.";
      content.appendChild(message);
      return;
    }

    showItems(section.title, section.items, false);
  });
});
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>
