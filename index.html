<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нур — Путь поминания Аллаха</title>
  <meta name="theme-color" content="#174b38">
  <link rel="manifest" href="./manifest.json">

<style>
:root {
  --green: #174b38;
  --green-dark: #103729;
  --green-light: #e6eddf;
  --gold: #d8b76c;
  --gold-light: #f1dfaa;
  --cream: #f7f5ed;
  --white: #fffefa;
  --text: #263b30;
  --muted: #718075;
  --border: #e5e7db;
  --shadow: 0 12px 32px rgba(23, 75, 56, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(ellipse at 15% 5%, rgba(216, 183, 108, 0.13), transparent 35%),
    radial-gradient(ellipse at 90% 30%, rgba(23, 75, 56, 0.08), transparent 35%),
    var(--cream);
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.6;
}

button {
  font: inherit;
  border: none;
  border-radius: 14px;
  padding: 13px 18px;
  margin: 5px;
  background: var(--green);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease,
    background 0.2s ease;
}

button:hover {
  background: var(--green-dark);
  box-shadow: 0 6px 16px rgba(16, 55, 41, 0.15);
  transform: translateY(-2px);
}

button:active {
  transform: scale(0.98);
}

button:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 4px;
}

.app {
  width: 100%;
  max-width: 1050px;
  margin: 0 auto;
  padding: 24px;
}

header {
  position: relative;
  overflow: hidden;
  text-align: center;
  padding: 38px 20px;
  background:
    radial-gradient(circle at 50% 0%, rgba(216, 183, 108, 0.18), transparent 55%),
    linear-gradient(135deg, #103729, #205b43 65%, #174b38);
  color: white;
  border: 1px solid rgba(216, 183, 108, 0.45);
  border-radius: 28px;
  box-shadow: 0 18px 40px rgba(16, 55, 41, 0.17);
  animation: nurFadeIn 0.8s ease both;
}

header::before,
header::after {
  content: "✧";
  position: absolute;
  color: var(--gold);
  font-size: 50px;
  opacity: 0.55;
}

header::before {
  top: 10px;
  left: 24px;
}

header::after {
  right: 24px;
  bottom: 8px;
}

.logo {
  font-size: 46px;
  color: var(--gold-light);
  line-height: 1.4;
  text-shadow: 0 0 28px rgba(241, 223, 170, 0.3);
  animation: nurTwinkle 5s ease-in-out infinite;
}

header h1 {
  margin: 6px 0;
  font-size: clamp(30px, 5vw, 42px);
  letter-spacing: 1px;
}

header p {
  margin: 4px 0 0;
  color: #e6eadf;
}

.welcome {
  margin: 24px 0;
  padding: 24px;
  background: linear-gradient(120deg, #e7eddf, #f4f0df);
  border: 1px solid #e0e4d5;
  border-radius: 22px;
  box-shadow: var(--shadow);
  animation: nurFadeIn 0.7s ease 0.1s both;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.welcome:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(23, 75, 56, 0.12);
}

.welcome p:first-child {
  margin-top: 0;
  font-size: 29px;
  color: var(--green);
  text-align: right;
}

.welcome h2 {
  margin-bottom: 5px;
  color: var(--green);
}

.welcome p:last-child {
  margin-bottom: 0;
}

h2 {
  font-size: 22px;
  color: var(--green);
}

main > h2 {
  margin: 28px 0 14px;
}

.counter {
  padding: 28px 20px;
  text-align: center;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: var(--shadow);
  animation: nurFadeIn 0.7s ease 0.2s both;
  transition: box-shadow 0.25s ease;
}

.counter p {
  color: var(--muted);
}

#count {
  margin: 10px;
  font-size: clamp(48px, 8vw, 64px);
  font-weight: 700;
  line-height: 1.3;
  color: var(--green);
  font-variant-numeric: tabular-nums;
  transition: transform 0.18s ease, color 0.18s ease;
}

#countButton {
  min-width: 170px;
  background: linear-gradient(135deg, #205b43, #123d2d);
  color: white;
  border: 1px solid rgba(216, 183, 108, 0.45);
  box-shadow: 0 7px 18px rgba(16, 55, 41, 0.15);
}

#countButton:active {
  transform: scale(0.96);
}

.secondary {
  background: var(--green-light);
  color: var(--green);
  border: 1px solid #dce5d9;
}

.secondary:hover {
  background: #d6e3d0;
  color: var(--green-dark);
}

.menu {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.menu-card {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 0;
  min-height: 160px;
  margin: 0;
  padding: 22px 12px;
  background: var(--white);
  color: var(--green);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 5px 18px rgba(23, 75, 56, 0.04);
  animation: nurFadeIn 0.6s ease both;
  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease,
    border-color 0.25s ease,
    background 0.25s ease;
}

.menu-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    135deg,
    rgba(216, 183, 108, 0.13),
    transparent 55%
  );
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}

.menu-card:hover {
  background: #fffdf6;
  border-color: var(--gold);
  transform: translateY(-5px);
  box-shadow: 0 14px 28px rgba(23, 75, 56, 0.12);
}

.menu-card:hover::before {
  opacity: 1;
}

.menu-card span {
  font-size: 31px;
  line-height: 1.5;
  color: #b18b42;
  transition: transform 0.25s ease;
}

.menu-card:hover span {
  transform: scale(1.08);
}

.menu-card strong {
  font-size: 17px;
}

.menu-card small {
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
}

.content {
  display: block;
  width: 100%;
  min-width: 0;
  margin-top: 24px;
  padding: 24px;
  min-height: 100px;
  background: var(--white);
  border: 1px solid rgba(229, 231, 219, 0.9);
  border-radius: 22px;
  box-shadow: var(--shadow);
  overflow-wrap: anywhere;
  animation: nurFadeIn 0.35s ease both;
}

.content > h2:first-child {
  margin-top: 0;
}

.dhikr-card {
  padding: 22px;
  margin: 16px 0;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: #fbfcf8;
  transition:
    transform 0.22s ease,
    box-shadow 0.22s ease,
    border-color 0.22s ease;
}

.dhikr-card:hover {
  transform: translateY(-2px);
  border-color: rgba(216, 183, 108, 0.75);
  box-shadow: 0 9px 22px rgba(23, 75, 56, 0.07);
}

.arabic {
  font-size: clamp(23px, 4vw, 29px);
  line-height: 2;
  text-align: right;
  color: var(--green);
}

.transcription {
  margin-top: 10px;
  font-style: italic;
  color: #8a6d3b;
}

.dhikr-card small {
  display: block;
  margin-top: 12px;
  line-height: 1.7;
  color: var(--muted);
}

.category-button {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 17px 20px;
  text-align: right;
  background: #edf1e7;
  color: var(--green);
  border: 1px solid #dce5d9;
  border-radius: 15px;
  font-size: 17px;
  transition:
    background 0.2s ease,
    transform 0.2s ease,
    border-color 0.2s ease;
}

.category-button:hover {
  background: #dfe9d8;
  transform: translateX(3px);
  border-color: var(--gold);
}

footer {
  margin: 30px 0 12px;
  padding: 12px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  opacity: 0.85;
}

@keyframes nurFadeIn {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes nurTwinkle {
  0%, 100% {
    opacity: 0.4;
    transform: scale(0.9) rotate(0deg);
  }
  50% {
    opacity: 0.9;
    transform: scale(1.1) rotate(12deg);
  }
}

.bottom-nav {
  position: sticky;
  bottom: 12px;
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 5px;
  max-width: 560px;
  margin: 24px auto 0;
  padding: 9px;
  background: rgba(255, 254, 250, 0.94);
  border: 1px solid rgba(216, 183, 108, 0.55);
  border-radius: 22px;
  box-shadow: 0 10px 32px rgba(16, 55, 41, 0.16);
  backdrop-filter: blur(14px);
}

.bottom-nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  margin: 0;
  padding: 9px 3px;
  background: transparent;
  color: var(--muted);
  border-radius: 14px;
  font-size: 11px;
  transition: background 0.2s ease, color 0.2s ease,
    transform 0.2s ease;
}

.bottom-nav button span {
  font-size: 21px;
  line-height: 1.3;
}

.bottom-nav button:hover,
.bottom-nav button.active {
  background: var(--green-light);
  color: var(--green);
  transform: translateY(-1px);
}

.bottom-nav button.active {
  box-shadow: inset 0 0 0 1px rgba(216, 183, 108, 0.4);
}

@media (max-width: 650px) {
  .app {
    padding: 12px;
  }

  header {
    padding: 30px 14px;
    border-radius: 24px;
  }

  header::before {
    left: 12px;
  }

  header::after {
    right: 12px;
  }

  .welcome,
  .content {
    padding: 18px;
  }

  .menu {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .menu-card {
    min-height: 100px;
    border-radius: 18px;
  }

  .counter {
    padding: 22px 12px;
  }

  .content {
    border-radius: 20px;
  }

  .dhikr-card {
    padding: 18px;
  }
}

@media (max-width: 400px) {
  .bottom-nav {
    bottom: 6px;
    padding: 6px;
  }

  .bottom-nav button {
    font-size: 10px;
  }

  .bottom-nav button span {
    font-size: 19px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

</head>
<body>

<div class="app">
  <header>
    <div class="logo">نُور</div>
    <h1>Нур</h1>
    <p>Путь поминания Аллаха</p>
  </header>

  <main>
    <section class="welcome">
      <p>السلام عليكم</p>
      <h2>Ассаляму алейкум!</h2>
      <p>Пусть день будет наполнен благом.</p>
    </section>

    <h2>Мой зикр</h2>

    <section class="counter">
      <p>Количество повторений</p>
      <div id="count">0</div>
      <button id="countButton">СубханАллах</button>
      <button id="resetButton" class="secondary">
        Сбросить счётчик
      </button>
    </section>

    <h2>Разделы</h2>

    <section class="menu">
      <button class="menu-card" data-section="azkar">
        <span>أذكار</span>
        <strong>Азкары</strong>
        <small>Поминание Аллаха</small>
      </button>

      <button class="menu-card" data-section="dua">
        <span>دعاء</span>
        <strong>Дуа</strong>
        <small>Мольбы</small>
      </button>

      <button class="menu-card" data-section="qibla">
        <span>🧭</span>
        <strong>Компас киблы</strong>
        <small>Направление на Каабу</small>
      </button>

      <button class="menu-card" data-section="prayer">
        <span>🕌</span>
        <strong>Время намаза</strong>
        <small>Расписание для Перми</small>
      </button>
    </section>

    <section id="content" class="content">
      Выбери раздел, чтобы продолжить.
    </section>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button type="button" class="active" data-nav="home">
        <span>⌂</span>
        Главная
      </button>
      <button type="button" data-nav="prayer">
        <span>🕌</span>
        Намаз
      </button>
      <button type="button" data-nav="azkar">
        <span>📿</span>
        Азкары
      </button>
      <button type="button" data-nav="dua">
        <span>🤲</span>
        Дуа
      </button>
    </nav>
  </main>

  <footer>
    Создано с намерением приносить пользу
  </footer>
</div>

<script>
let count = 0;

const countDisplay = document.getElementById("count");
const countButton = document.getElementById("countButton");
const resetButton = document.getElementById("resetButton");
const content = document.getElementById("content");

// Счётчик зикра
countButton.addEventListener("click", function () {
  count++;
  countDisplay.textContent = count;
});

resetButton.addEventListener("click", function () {
  count = 0;
  countDisplay.textContent = count;
});

// Суры и аяты, читаемые утром и вечером
const coreRecitations = [
  {
    arabic: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",
    transcription: "Аллаху ля иляха илля хува, аль-Хайюль-Кайюм. Ля та'хузуху синатун ва ля навм. Ляху ма фис-самавати ва ма филь-ард. Ман заллязи яшфа'у 'индаху илля би-изних. Я'ляму ма байна айдихим ва ма хальфахум. Ва ля юхитуна би-шай'im-мин 'ильмихи илля би-ма ша'. Васи'а курсийюхус-самавати валь-ард, ва ля я'удуху хифзухума, ва хуваль-'алийюль-'азым.",
    translation: "Аллах — нет божества, кроме Него, Живого, Вседержителя. Не им овладевают ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто станет заступаться перед Ним без Его дозволения? Он знает их будущее и прошлое. Они постигают из Его знания только то, что Он пожелает. Его Престол объемлет небеса и землю, и не тяготит Его оберегание их. Он — Возвышенный, Великий.",
    count: 1,
    source: "Коран, сура «Аль-Бакара», аят 255 (Аят аль-Курси)."
  },
  {
    arabic: "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ",
    transcription: "Куль хувал-Ллаху ахад. Аллаhus-Самад..." .replace("{}", ""),
    translation: "",
    count: 3,
    source: ""
  }
];
</script>
</body>
</html>
